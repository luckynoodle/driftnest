name: Build web & deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot + export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Download Godot + web templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          set -e
          V=${GODOT_VERSION}
          BASE=https://github.com/godotengine/godot/releases/download/${V}-stable
          mkdir -p ~/godot
          wget -q "$BASE/Godot_v${V}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${V}-stable_linux.x86_64 ~/godot/godot
          wget -q "$BASE/Godot_v${V}-stable_export_templates.tpz" -O templates.tpz
          T=~/.local/share/godot/export_templates/${V}.stable
          mkdir -p "$T"
          unzip -q -j templates.tpz "templates/web_*" "templates/version.txt" -d "$T"
          ls "$T"

      - name: Import project
        run: timeout 300 ~/godot/godot --headless --editor --quit || true

      - name: Smoke test (headless play-through, classic 2D)
        run: timeout 300 ~/godot/godot --headless --path . -- --smoke

      - name: Smoke test (headless play-through, 3D town)
        run: timeout 300 ~/godot/godot --headless --path . -- --smoke --3d

      - name: Balance check (simulated first two hours must hit the pacing targets)
        run: timeout 300 ~/godot/godot --headless --path . -- --balance

      - name: Stamp build info (shown in Settings so testers can say which build they're on)
        run: echo "{\"commit\":\"${GITHUB_SHA}\",\"date\":\"$(date -u +%Y-%m-%d)\"}" > build_info.json

      - name: Export web build
        run: |
          mkdir -p build/web
          ~/godot/godot --headless --export-release "Web" build/web/index.html
          ls -la build/web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
